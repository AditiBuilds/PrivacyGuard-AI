version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./privacyguard.db
      - LLM_PROVIDER=deterministic
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_ONLY_PROCESSING=true
    volumes:
      - ./backend/privacyguard.db:/app/privacyguard.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
